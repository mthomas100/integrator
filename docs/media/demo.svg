<rect width="100%" height="30" rx="10" fill="#23262e"/><rect y="20" width="100%" height="10" fill="#23262e"/>
<circle cx="18" cy="15" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15" r="5.5" fill="#febc2e"/><circle cx="54" cy="15" r="5.5" fill="#28c840"/>
<text x="439" y="19.5" fill="#7d8594" text-anchor="middle" style="font-size:12px">integrator: three sessions, one landing (a real run of docs/demo/run-demo.sh)</text>
<text class="r0" x="18.0" y="61.5"><tspan fill="#7d8594"># before anything is submitted, the integrator trial-merges every branch against main and the others</tspan></text>
<text class="r1" x="18.0" y="79.0"><tspan fill="#f0b45e">[integrator] $ </tspan><tspan fill="#ffffff">integrator conflicts</tspan></text>
<text class="r2" x="18.0" y="96.5"><tspan fill="#f2777a">CONFLICT</tspan><tspan fill="#c9ced8"> csv-header × csv-quotes: reader.py. Order them: one lands first, the other syncs right after.  [new]</tspan></text>
<text class="r3" x="18.0" y="114.0"><tspan fill="#f0b45e">CLAIM</tspan><tspan fill="#c9ced8">    csv-header changed reader.py, which csv-quotes claimed (reader.py)  [new]</tspan></text>
<text class="r4" x="18.0" y="131.5"><tspan fill="#f2777a">[exit 1]</tspan></text>
<text class="r5" x="18.0" y="149.0"><tspan fill="#7d8594"># the integrator lands the queue; #2 collides with #1 in reader.py</tspan></text>
<text class="r6" x="18.0" y="166.5"><tspan fill="#f0b45e">[integrator] $ </tspan><tspan fill="#ffffff">integrator land all</tspan></text>
<text class="r7" x="18.0" y="184.0"><tspan fill="#f2777a">CONFLICT landing</tspan><tspan fill="#c9ced8"> #2 (csv-header: read_rows can skip the header row) in: reader.py</tspan></text>
<text class="r8" x="18.0" y="201.5"><tspan fill="#6cc6d9">hint (this repo):</tspan><tspan fill="#c9ced8"> keep both sides: split_line() is the new splitter, read_rows() its only caller</tspan></text>
<text class="r9" x="18.0" y="219.0"><tspan fill="#c9ced8">  resolve in ~/work/csvtool/.claude/worktrees/integration: keep both sides' intent (main's side: `git -C</tspan></text>
<text class="r10" x="18.0" y="236.5"><tspan fill="#c9ced8">    ~/work/csvtool/.claude/worktrees/integration log -p 08ab87bb0024c5a3ca9688b3e5d326a2957f7340 -3 -- &lt;file&gt;`;</tspan></text>
<text class="r11" x="18.0" y="254.0"><tspan fill="#c9ced8">    theirs: the submission summary and `git -C ~/work/csvtool/.claude/worktrees/integration log -p</tspan></text>
<text class="r12" x="18.0" y="271.5"><tspan fill="#c9ced8">    f3d711800899f5dff58e106844315876622aba92 -3 -- &lt;file&gt;`), `git add`,</tspan></text>
<text class="r13" x="18.0" y="289.0"><tspan fill="#c9ced8">  then `integrator land --continue` (a hand resolution needs `--verify` or `--trust WHY`), or `integrator land</tspan></text>
<text class="r14" x="18.0" y="306.5"><tspan fill="#c9ced8">    --abort` and `integrator bounce` it to its author.</tspan></text>
<text class="r15" x="18.0" y="324.0"><tspan fill="#f2777a">[exit 3]</tspan></text>
<text class="r16" x="18.0" y="341.5"><tspan fill="#7d8594"># it keeps both sides' intent in its integration worktree (edit applied by this script)</tspan></text>
<text class="r17" x="18.0" y="359.0"><tspan fill="#f0b45e">[integrator] $ </tspan><tspan fill="#ffffff">git -C .claude/worktrees/integration add reader.py</tspan></text>
<text class="r18" x="18.0" y="376.5"><tspan fill="#f0b45e">[integrator] $ </tspan><tspan fill="#ffffff">integrator land --continue</tspan></text>
<text class="r19" x="18.0" y="394.0"><tspan fill="#f0b45e">NEEDS-VERIFY</tspan><tspan fill="#c9ced8">: the contributors' own checks don't cover what would land:</tspan></text>
<text class="r20" x="18.0" y="411.5"><tspan fill="#c9ced8">  #2: resolved: conflicts resolved by the integrator in reader.py</tspan></text>
<text class="r21" x="18.0" y="429.0"><tspan fill="#c9ced8">Choose: `integrator land --continue --verify` (run the checks in the integration worktree, once for the batch),</tspan></text>
<text class="r22" x="18.0" y="446.5"><tspan fill="#c9ced8">  `--continue --trust "&lt;why it's safe&gt;"`, or `--abort` and bounce it for a sync and re-check by its author.</tspan></text>
<text class="r23" x="18.0" y="464.0"><tspan fill="#f2777a">[exit 4]</tspan></text>
<text class="r24" x="18.0" y="481.5"><tspan fill="#f0b45e">[integrator] $ </tspan><tspan fill="#ffffff">integrator land --continue --verify</tspan></text>
<text class="r25" x="18.0" y="499.0"><tspan fill="#c9ced8">verifying in ~/work/csvtool/.claude/worktrees/integration: python3 -m unittest -q</tspan></text>
<text class="r26" x="18.0" y="516.5"><tspan fill="#7fd1a0">VERIFY OK</tspan><tspan fill="#c9ced8"> (0 s)</tspan></text>
<text class="r27" x="18.0" y="534.0"><tspan fill="#7fd1a0">LANDED</tspan><tspan fill="#c9ced8"> on main → 51cee944a (integrator (0 s))</tspan></text>
<text class="r28" x="18.0" y="551.5"><tspan fill="#c9ced8">  #1 csv-quotes: Keep commas inside quoted fields </tspan><tspan fill="#7fd1a0">[exact]</tspan></text>
<text class="r29" x="18.0" y="569.0"><tspan fill="#c9ced8">    tell: SendMessage to 'csv-quotes': "#1 landed as 51cee944a."</tspan></text>
<text class="r30" x="18.0" y="586.5"><tspan fill="#c9ced8">  #2 csv-header: read_rows can skip the header row </tspan><tspan fill="#f0b45e">[resolved, rebased]</tspan></text>
<text class="r31" x="18.0" y="604.0"><tspan fill="#c9ced8">    tell: SendMessage to 'csv-header': "#2 landed as 51cee944a. It was rebased: run `integrator sync` before</tspan></text>
<text class="r32" x="18.0" y="621.5"><tspan fill="#c9ced8">      your next submit."</tspan></text>
<text class="r33" x="18.0" y="639.0"><tspan fill="#c9ced8">  #3 cli-delim: csvtool takes --delimiter </tspan><tspan fill="#7fd1a0">[disjoint, rebased]</tspan></text>
<text class="r34" x="18.0" y="656.5"><tspan fill="#c9ced8">    tell: SendMessage to 'cli-delim': "#3 landed as 51cee944a. It was rebased: run `integrator sync` before your</tspan></text>
<text class="r35" x="18.0" y="674.0"><tspan fill="#c9ced8">      next submit."</tspan></text>
<text class="r36" x="18.0" y="691.5"><tspan fill="#f0b45e">[integrator] $ </tspan><tspan fill="#ffffff">git log --oneline</tspan></text>
<text class="r37" x="18.0" y="709.0"><tspan fill="#c9ced8">51cee94 csvtool takes --delimiter</tspan></text>
<text class="r38" x="18.0" y="726.5"><tspan fill="#c9ced8">73f618e read_rows can skip the header row</tspan></text>
<text class="r39" x="18.0" y="744.0"><tspan fill="#c9ced8">08ab87b Keep commas inside quoted fields</tspan></text>
<text class="r40" x="18.0" y="761.5"><tspan fill="#c9ced8">d4434c4 csvtool: read_rows, a small CLI and a test</tspan></text>
</svg>
